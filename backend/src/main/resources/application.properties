spring.application.name=backend

# ── Base de datos (via variables de entorno) ──────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/miel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# "update" solo en desarrollo. En produccion usar "validate"
spring.jpa.hibernate.ddl-auto=update
# show-sql solo en desarrollo local, deshabilitar en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
# OBLIGATORIO: definir APP_JWT_SECRET como variable de entorno (min 64 chars)
app.jwtSecret=${APP_JWT_SECRET}
# 4 horas en ms (era 24h)
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:14400000}

# ── Email SMTP ────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
