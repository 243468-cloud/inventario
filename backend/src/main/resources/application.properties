spring.application.name=backend

# ── Base de datos ─────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/miel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── HikariCP: pool mínimo para ahorrar memoria ────────────────────────────────
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Desactiva open-in-view (ahorra memoria y evita queries innecesarias)
spring.jpa.open-in-view=false
# Batch inserts/updates para eficiencia
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Estadísticas desactivadas (innecesarias en producción)
spring.jpa.properties.hibernate.generate_statistics=false

# ── Tomcat: threads mínimos para ahorrar memoria ──────────────────────────────
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwtSecret=${APP_JWT_SECRET}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:14400000}
